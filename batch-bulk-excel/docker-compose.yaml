name: batch-bulk-excel

services:
  mysql:
    image: mysql:8.0
    container_name: batch-bulk-excel-mysql
    ports:
      - "10000:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: batch_bulk_excel
      MYSQL_USER: batch
      MYSQL_PASSWORD: batch1234
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot1234" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.0
    container_name: batch-bulk-excel-kafka
    ports:
      - "10010:10010"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 리스너 2개: HOST(호스트의 Spring 앱용, advertised localhost:10010) / INTERNAL(컨테이너용, advertised kafka:10011)
      KAFKA_LISTENERS: CONTROLLER://:10012,HOST://:10010,INTERNAL://:10011
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:10010,INTERNAL://kafka:10011
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:10012
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:10010 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: batch-bulk-excel-kafka-ui
    ports:
      - "10020:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:10011   # INTERNAL 리스너 (컨테이너용). 호스트는 localhost:10010
    #      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

volumes:
  mysql-data:
