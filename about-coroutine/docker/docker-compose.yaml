name: about-coroutine

services:
  mysql:
    image: mysql:8.0
    container_name: ac-mysql
    ports:
      - "8010:3306"
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=ac
      - MYSQL_USER=ac
      - MYSQL_PASSWORD=ac1234
    volumes:
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 512M

