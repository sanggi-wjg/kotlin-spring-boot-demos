server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6501
      database: 0

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-application
              uri: http://localhost:8081
              predicates:
                - Host=order.localhost:*
              filters:
                - AddRequestHeadersIfNotPresent=X-Gateway-Id:order-application
                - name: RequestRateLimiter # 레이트 리밋은 토큰 버킷 알고리즘을 사용하고 있다
                  args:
                    redis-rate-limiter.replenishRate: 10 # 초당 채워지는 토큰
                    redis-rate-limiter.burstCapacity: 20 # 토큰 버킷 최대 크기
                    redis-rate-limiter.requestedTokens: 1 # 요청당 소모 토큰 수
                    key-resolver: "#{@userKeyResolver}" # RateLimiterConfig 빈 생성 / "#{@ipKeyResolver}" 사용 가능

            - id: task-application
              uri: http://localhost:8082
              predicates:
                - Host=task.localhost:*
              filters:
                - AddRequestHeadersIfNotPresent=X-Gateway-Id:task-application

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods: "*"
                allowed-headers: "*"
