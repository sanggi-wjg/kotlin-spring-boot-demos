spring:
  application:
    name: boiler
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: true
        default_batch_fetch_size: 50
        # order_updates: true

  datasource:
    hikari:
      pool-name: boiler-pool
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://localhost:6500/boiler
      username: boiler
      password: boiler1234
      maximum-pool-size: 30

  data:
    redis:
      host: localhost
      port: 6501
      database: 0
